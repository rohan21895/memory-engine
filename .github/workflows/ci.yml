name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Tauri Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Tauri Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      # workers/render-video drives ffmpeg and ffprobe directly, and its tests
      # render real files and read them back. They fail rather than skip when the
      # tools are missing, deliberately: a renderer whose tests quietly do not run
      # is worse than one with no tests.
      - name: Install ffmpeg
        run: sudo apt-get install --yes ffmpeg
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # run-workspace-check.mjs discovers every pyproject.toml and runs its
      # tests. contracts/ validates fixtures against the schemas and round-trips
      # them through the generated pydantic models, so those two libraries have
      # to be present here as well as in the Contracts job.
      #
      # blake3 is here because content-addressed ids are load-bearing: the
      # story-engine raises rather than falling back to blake2b when it is
      # absent, deliberately, since an id that claims to be a content address
      # and is not would break job idempotency without ever raising.
      - run: python3 -m pip install --upgrade pip
      # Pillow and numpy are the classical-quality executor's only dependencies.
      # services/pipeline's tests ERROR rather than skip when they are absent,
      # which is deliberate -- a skipped measurement must not read as a passing
      # one -- so CI has to carry them.
      - run: python3 -m pip install "pydantic>=2.7" "jsonschema>=4.20" "blake3>=0.4" "pillow>=10.0" "numpy>=1.26" ./workers/ml-runtime
      - run: npm ci --ignore-scripts
      # The Linux host has no NVDEC device and the production ingest worker
      # correctly refuses software decode. Run every other workspace component
      # here and defer services/pipeline to the required macOS VideoToolbox job
      # below. The runner names the deferral rather than reporting a skip/pass.
      - run: node scripts/ci/run-workspace-check.mjs test --defer-pipeline
      # CLAUDE.md hard rule 7: "Model swaps are gated by the eval harness in
      # CI." Until this step existed the harness was a library nothing but its
      # own test file imported, so the rule was not true. Every committed
      # gate file runs here.
      #
      # Exit codes are three separate answers, not two: 0 pass, 1 a measured
      # regression, 2 a REFUSED comparison (mismatched digests, mixed model
      # sets, unpinned weights -- no measurement exists), 3 an unusable gate
      # file. All of 1/2/3 fail this job; the number says which human should
      # act. Do not collapse them, and note that 2 is also argparse's default
      # usage code, which is why the command overrides it.
      - name: Eval harness regression gate
        working-directory: packages/eval-harness
        run: python3 -m memory_engine_eval.harness gates/*.gate.json

  pipeline-integration:
    name: Pipeline Integration (VideoToolbox)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # The supported runtime is FFmpeg 7. An unversioned install pulled 8.1.2:
      # its capability tables advertised the full VideoToolbox pipeline, but
      # every real proxy command failed. Pin the major and link the keg-only
      # formula so both the Python fixture builder and Rust worker resolve it.
      - run: brew install ffmpeg@7
      - run: brew link --force ffmpeg@7
      - run: python3 -m pip install --upgrade pip
      - run: python3 -m pip install "pydantic>=2.7" "jsonschema>=4.20" "blake3>=0.4" "pillow>=10.0" "numpy>=1.26" ./workers/ml-runtime
      - run: npm ci --ignore-scripts
      # `cargo test` only creates a debug worker and vitest does not emit
      # render-video/dist. Build the exact artifacts the pipeline invokes.
      - run: cargo build --release --manifest-path workers/ingest/Cargo.toml --all-features
      - run: npm run build --workspace @memory-engine/render-video
      # Capability tables are not proof: FFmpeg 7 and 8 both advertised this
      # complete chain on the hosted runner and the worker still failed at
      # runtime (#106). So the chain is PROBED with real frames, and what runs
      # next depends on what the probe proved -- never on what was advertised.
      # Exercise synthetic bytes here so stderr is safe to publish; production
      # worker errors deliberately redact source details.
      - name: Probe the VideoToolbox production chain with real frames
        id: videotoolbox
        continue-on-error: true
        run: |
          pipeline_fixture_source="${RUNNER_TEMP}/memory-engine-vt-source.mp4"
          pipeline_fixture_proxy="${RUNNER_TEMP}/memory-engine-vt-proxy.mp4"
          ffmpeg -hide_banner -nostdin -loglevel error \
            -f lavfi -i "testsrc2=size=320x240:rate=30" -t 1 \
            -c:v libx264 -pix_fmt yuv420p -y "${pipeline_fixture_source}"
          ffmpeg -hide_banner -nostdin -loglevel info \
            -hwaccel videotoolbox -hwaccel_output_format videotoolbox_vld \
            -i "${pipeline_fixture_source}" -map 0:v:0 -map '0:a?' \
            -map_metadata -1 \
            -vf "scale_vt=w=ceil(iw*480/ih/2)*2:h=480,hwdownload,format=nv12,setsar=1,showinfo" \
            -fps_mode passthrough -c:v h264_videotoolbox -allow_sw 0 \
            -profile:v high -b:v 1060660 -c:a aac -b:a 96k \
            -movflags +faststart -y "${pipeline_fixture_proxy}"
      # The gate itself, wherever the probe proved the hardware real. On a
      # future self-hosted or vendor Apple-silicon runner this turns the full
      # required suite back on with no workflow change.
      - name: Hardware pipeline suite (required wherever the chain works)
        if: steps.videotoolbox.outcome == 'success'
        run: python3 services/pipeline/tests/run_required_suite.py
      # Owner decision on #106, option 3: hosted GitHub macOS advertises
      # VideoToolbox but cannot initialise it, so on these runners the
      # hardware gate is declared NOT RUN -- loudly, with the issue that
      # documents why -- rather than skipped in a way that reads as a pass.
      # Green on this job therefore means "software smoke passed", never
      # "hardware gate passed"; #91 and the Phase 1 hardware gate remain open
      # until the suite runs on real Apple silicon.
      - name: 'Hardware gate NOT RUN here — see #106'
        if: steps.videotoolbox.outcome != 'success'
        run: |
          echo "::notice title=Hardware gate NOT RUN::This hosted runner advertises VideoToolbox but cannot initialise it (#106). The 88-test hardware suite must run on real Apple silicon and is executed on the maintainer's machine; green here covers the software smoke only."
      # What CAN honestly execute here: the same fixture build, container
      # conventions and probe reporting through a software decode, so parsing,
      # proxy shape and failure surfacing are still exercised on every PR.
      - name: Software-decode smoke (runs where the hardware gate cannot)
        if: steps.videotoolbox.outcome != 'success'
        run: |
          smoke_source="${RUNNER_TEMP}/memory-engine-sw-source.mp4"
          smoke_proxy="${RUNNER_TEMP}/memory-engine-sw-proxy.mp4"
          ffmpeg -hide_banner -nostdin -loglevel error \
            -f lavfi -i "testsrc2=size=320x240:rate=30" -t 1 \
            -c:v libx264 -pix_fmt yuv420p -y "${smoke_source}"
          ffmpeg -hide_banner -nostdin -loglevel error \
            -i "${smoke_source}" -map 0:v:0 -map '0:a?' -map_metadata -1 \
            -vf "scale=w=ceil(iw*240/ih/2)*2:h=240,setsar=1" \
            -fps_mode passthrough -c:v libx264 -pix_fmt yuv420p \
            -movflags +faststart -y "${smoke_proxy}"
          height=$(ffprobe -v error -select_streams v:0 \
            -show_entries stream=height -of csv=p=0 "${smoke_proxy}")
          test "${height}" = "240" || { echo "proxy height ${height} != 240"; exit 1; }

  windows-ingest:
    name: Windows Ingest
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      # The Windows proxy backends are selected at runtime, so this native build
      # keeps their cfg path and command-construction tests exercised without
      # requiring a GPU on the hosted runner.
      - run: cargo test --manifest-path workers/ingest/Cargo.toml --all-features

  windows-desktop:
    name: Windows Desktop
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --all-features

  shadow-files:
    name: Shadow Files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      # Cheap, and it caught a phantom migration that read as a broken
      # migration set rather than as a stray file. Runs on its own so the
      # failure names itself.
      - run: node --test scripts/ci/check-no-shadow-files.test.mjs
      - run: node scripts/ci/check-no-shadow-files.mjs
      # Fails if scripts/ci/local-ci.sh stops covering what this workflow runs.
      # That script claimed CI-equivalence while omitting four gates, including
      # the one directly above, for three days (#97).
      - run: node scripts/ci/check-local-ci-parity.mjs

  codegen-freshness:
    name: Codegen Freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: npm ci --ignore-scripts
      - run: npm run codegen:check

  contracts:
    name: Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python3 -m pip install --upgrade pip
      - run: python3 -m pip install "pydantic>=2.7" "jsonschema>=4.20" "blake3>=0.4" "protobuf>=5.28.1,<6"
      # Golden tests: schemas are well formed, every fixture behaves as the
      # manifest declares, cross-field invariants hold, and the committed
      # bindings both parse and round-trip the fixtures.
      - run: python3 scripts/ci/run-required-unittest.py contracts/tests

  demo-scripts:
    name: Demo Scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python3 -m pip install --upgrade pip
      - run: python3 -m pip install "pillow>=10" "numpy>=1.26" "blake3>=0.4"
      # Guards the synthetic library generator: unique planned filenames, the
      # GoPro chapter naming convention checked against an independent oracle,
      # manifest/disk reconciliation, and the demo runner's rule that a stage
      # which did not run can never read as a pass. No ffmpeg here on purpose --
      # the generator's --no-video path is exercised instead, and it is required
      # to declare itself incomplete rather than exit 0.
      - run: python3 scripts/ci/run-required-unittest.py scripts/demo/tests

  egress-test:
    name: Egress Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # tests/egress/contact-sheet.test.mjs composes a real contact sheet from
      # proxies stuffed with EXIF, GPS, an ICC profile and a PNG text chunk
      # holding a path, then inspects the emitted bytes with its own chunk
      # walker. It FAILS rather than skips when these are missing, deliberately:
      # an egress check that did not run must not read as one that passed.
      # The same suite also opens a loopback listener and proves the API egress
      # gate never connects without an exact live ledger grant, then exercises
      # the crash/analytics privacy filter. No TODO or skipped policy check is
      # accepted as a pass.
      - run: python3 -m pip install --upgrade pip
      - run: python3 -m pip install "pillow>=10.0" "blake3>=0.4"
      - run: npm ci --ignore-scripts
      - run: npm run test:egress
