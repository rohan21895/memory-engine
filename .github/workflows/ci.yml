name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Tauri Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Tauri Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      # workers/render-video drives ffmpeg and ffprobe directly, and its tests
      # render real files and read them back. They fail rather than skip when the
      # tools are missing, deliberately: a renderer whose tests quietly do not run
      # is worse than one with no tests.
      - name: Install ffmpeg
        run: sudo apt-get install --yes ffmpeg
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # run-workspace-check.mjs discovers every pyproject.toml and runs its
      # tests. contracts/ validates fixtures against the schemas and round-trips
      # them through the generated pydantic models, so those two libraries have
      # to be present here as well as in the Contracts job.
      #
      # blake3 is here because content-addressed ids are load-bearing: the
      # story-engine raises rather than falling back to blake2b when it is
      # absent, deliberately, since an id that claims to be a content address
      # and is not would break job idempotency without ever raising.
      - run: python3 -m pip install --upgrade pip
      # Pillow and numpy are the classical-quality executor's only dependencies.
      # services/pipeline's tests ERROR rather than skip when they are absent,
      # which is deliberate -- a skipped measurement must not read as a passing
      # one -- so CI has to carry them.
      - run: python3 -m pip install "pydantic>=2.7" "jsonschema>=4.20" "blake3>=0.4" "pillow>=10.0" "numpy>=1.26" ./workers/ml-runtime
      - run: npm ci --ignore-scripts
      - run: npm test
      # Unlike unittest's default runner, this exits non-zero if any required
      # ml-runtime module or test is skipped.
      - run: python3 workers/ml-runtime/tests/run_required_suite.py
      # CLAUDE.md hard rule 7: "Model swaps are gated by the eval harness in
      # CI." Until this step existed the harness was a library nothing but its
      # own test file imported, so the rule was not true. Every committed
      # gate file runs here.
      #
      # Exit codes are three separate answers, not two: 0 pass, 1 a measured
      # regression, 2 a REFUSED comparison (mismatched digests, mixed model
      # sets, unpinned weights -- no measurement exists), 3 an unusable gate
      # file. All of 1/2/3 fail this job; the number says which human should
      # act. Do not collapse them, and note that 2 is also argparse's default
      # usage code, which is why the command overrides it.
      - name: Eval harness regression gate
        working-directory: packages/eval-harness
        run: python3 -m memory_engine_eval.harness gates/*.gate.json

  windows-ingest:
    name: Windows Ingest
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      # The Windows proxy backends are selected at runtime, so this native build
      # keeps their cfg path and command-construction tests exercised without
      # requiring a GPU on the hosted runner.
      - run: cargo test --manifest-path workers/ingest/Cargo.toml --all-features

  windows-desktop:
    name: Windows Desktop
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --all-features

  shadow-files:
    name: Shadow Files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      # Cheap, and it caught a phantom migration that read as a broken
      # migration set rather than as a stray file. Runs on its own so the
      # failure names itself.
      - run: node --test scripts/ci/check-no-shadow-files.test.mjs
      - run: node scripts/ci/check-no-shadow-files.mjs
      # Fails if scripts/ci/local-ci.sh stops covering what this workflow runs.
      # That script claimed CI-equivalence while omitting four gates, including
      # the one directly above, for three days (#97).
      - run: node scripts/ci/check-local-ci-parity.mjs

  codegen-freshness:
    name: Codegen Freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: npm ci --ignore-scripts
      - run: npm run codegen:check

  contracts:
    name: Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python3 -m pip install --upgrade pip
      - run: python3 -m pip install "pydantic>=2.7" "jsonschema>=4.20" "blake3>=0.4"
      # Golden tests: schemas are well formed, every fixture behaves as the
      # manifest declares, cross-field invariants hold, and the committed
      # bindings both parse and round-trip the fixtures.
      - run: python3 -m unittest discover -s contracts/tests -v

  demo-scripts:
    name: Demo Scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python3 -m pip install --upgrade pip
      - run: python3 -m pip install "pillow>=10" "numpy>=1.26" "blake3>=0.4"
      # Guards the synthetic library generator: unique planned filenames, the
      # GoPro chapter naming convention checked against an independent oracle,
      # manifest/disk reconciliation, and the demo runner's rule that a stage
      # which did not run can never read as a pass. No ffmpeg here on purpose --
      # the generator's --no-video path is exercised instead, and it is required
      # to declare itself incomplete rather than exit 0.
      - run: python3 -m unittest discover -s scripts/demo/tests -v

  egress-test:
    name: Egress Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # tests/egress/contact-sheet.test.mjs composes a real contact sheet from
      # proxies stuffed with EXIF, GPS, an ICC profile and a PNG text chunk
      # holding a path, then inspects the emitted bytes with its own chunk
      # walker. It FAILS rather than skips when these are missing, deliberately:
      # an egress check that did not run must not read as one that passed.
      - run: python3 -m pip install --upgrade pip
      - run: python3 -m pip install "pillow>=10.0" "blake3>=0.4"
      - run: npm ci --ignore-scripts
      - run: npm run test:egress
