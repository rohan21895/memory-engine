name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Tauri Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Tauri Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # run-workspace-check.mjs discovers every pyproject.toml and runs its
      # tests. contracts/ validates fixtures against the schemas and round-trips
      # them through the generated pydantic models, so those two libraries have
      # to be present here as well as in the Contracts job.
      #
      # blake3 is here because content-addressed ids are load-bearing: the
      # story-engine raises rather than falling back to blake2b when it is
      # absent, deliberately, since an id that claims to be a content address
      # and is not would break job idempotency without ever raising.
      - run: python3 -m pip install --upgrade pip
      - run: python3 -m pip install "pydantic>=2.7" "jsonschema>=4.20" "blake3>=0.4"
      - run: npm ci --ignore-scripts
      - run: npm test

  windows-ingest:
    name: Windows Ingest
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      # The Windows proxy backends are selected at runtime, so this native build
      # keeps their cfg path and command-construction tests exercised without
      # requiring a GPU on the hosted runner.
      - run: cargo test --manifest-path workers/ingest/Cargo.toml --all-features

  windows-desktop:
    name: Windows Desktop
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --all-features

  codegen-freshness:
    name: Codegen Freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: npm ci --ignore-scripts
      - run: npm run codegen:check

  contracts:
    name: Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python3 -m pip install --upgrade pip
      - run: python3 -m pip install "pydantic>=2.7" "jsonschema>=4.20" "blake3>=0.4"
      # Golden tests: schemas are well formed, every fixture behaves as the
      # manifest declares, cross-field invariants hold, and the committed
      # bindings both parse and round-trip the fixtures.
      - run: python3 -m unittest discover -s contracts/tests -v

  egress-test:
    name: Egress Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:egress
