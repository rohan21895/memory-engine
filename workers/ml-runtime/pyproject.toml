[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "memory-engine-ml-runtime"
version = "0.1.0"
description = "Loopback-only model hosting service for Memory Engine"
requires-python = ">=3.12"
dependencies = [
  "blake3>=0.4",
  "grpcio>=1.68.1",
  "jsonschema>=4.23",
  "numpy>=1.26,<3",
  "onnxruntime>=1.20,<2; platform_system != 'Windows'",
  "onnxruntime-directml>=1.20,<2; platform_system == 'Windows'",
  "opencv-python-headless>=4.10,<5",
  "protobuf>=5.28.1,<6",
  "referencing>=0.35",
]

[project.scripts]
memory-engine-ml-runtime = "memory_engine_ml_runtime.__main__:main"
memory-engine-photo-smoke = "memory_engine_ml_runtime.smoke:main"

[tool.setuptools.packages.find]
include = ["memory_engine_ml_runtime*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
