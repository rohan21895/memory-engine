plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.photeolitert'
version = '0.1.0'

android {
  namespace "expo.modules.photeolitert"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // Match react-native-fast-tflite's shipped runtime. Changing this version is
  // a model-runtime migration and needs numerical comparison on real outputs.
  implementation 'com.google.ai.edge.litert:litert:1.4.0'
}
