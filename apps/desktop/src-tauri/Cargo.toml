[package]
name = "memory-engine-desktop"
version = "0.1.0"
description = "Private local-first family memory organizer"
authors = ["Memory Engine"]
edition = "2021"
publish = false

[lib]
name = "memory_engine_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
blake3 = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
memory-engine-contracts = { path = "../../../contracts/codegen/generated/rust" }
memory-engine-ingest = { path = "../../../workers/ingest" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
walkdir = "2"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
