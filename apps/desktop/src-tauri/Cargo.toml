[package]
name = "memory-engine-desktop"
version = "0.1.0"
description = "Private local-first family memory organizer"
authors = ["Memory Engine"]
edition = "2021"
publish = false

[lib]
name = "memory_engine_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
protoc-bin-vendored = "3.2"
tauri-build = { version = "2", features = [] }
tonic-prost-build = "0.14.6"

[dependencies]
blake3 = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
memory-engine-contracts = { path = "../../../contracts/codegen/generated/rust" }
memory-engine-ingest = { path = "../../../workers/ingest" }
prost = "0.14.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["sync"] }
tonic = { version = "0.14.6", features = ["transport"] }
tonic-prost = "0.14.6"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync"] }
tokio-stream = { version = "0.1", features = ["net"] }

[lints.rust]
unsafe_code = "forbid"
